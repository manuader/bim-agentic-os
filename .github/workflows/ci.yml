name: engineering-gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Worktree retire safety oracle
        run: bash tests/baton/worktree-retire.test.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, core/evaluator unit health, static gates and benchmark
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Dependency vulnerability audit
        shell: pwsh
        run: ./scripts/audit-dependencies.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          include-hidden-files: true
          path: |
            .bim/verification/
            .bim/evaluation/
            .bim/dependency-audit/
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build interfaces/cli/Bim.Cli.csproj --configuration Release
      - uses: github/codeql-action/analyze@v3
  ifc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install approved isolated IFC dependencies
        run: |
          python -m venv .tools/ifc
          .tools/ifc/bin/python -m pip install -r requirements/ifc.txt
          .tools/ifc/bin/python -m pip check
      - name: Real IFC integration regressions
        run: .tools/ifc/bin/python -m unittest discover -s tests/ifc -p 'test_*.py' -v
      - name: Skill manifest schema agreement
        run: |
          .tools/ifc/bin/python -m pip install jsonschema==4.23.0
          .tools/ifc/bin/python -I tests/skills/check_schema.py
      - name: ezdxf 1.4.2 generator constant check, two-way (P6-46)
        run: |
          python -m venv .tools/ezdxf
          # P6-48: numpy pinned to the version the constants were generated with (2.5.5 was resolved unpinned). P6-50: the
          # other ezdxf dependencies pinned to the versions pip resolved here in run 45725166224 (printed below).
          .tools/ezdxf/bin/python -m pip install ezdxf==1.4.2 numpy==2.5.3 pyparsing==3.3.3 typing_extensions==4.16.0 fonttools==4.69.1
          .tools/ezdxf/bin/python -m pip check
          # P6-50: the installed versions of ezdxf's other dependencies are printed with numpy's. P6-52: with the CPU model
          # (from /proc/cpuinfo) and the exact Python version (all of sys.version, on one line).
          cpu=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')
          echo "::notice title=ezdxf-check::cpu ${cpu:-unknown}; $(.tools/ezdxf/bin/python -I -c "import sys, importlib.metadata, numpy, ezdxf; print('python', ' '.join(sys.version.split()), 'numpy', numpy.__version__, *(d + ' ' + importlib.metadata.version(d) for d in ('pyparsing', 'typing_extensions', 'fonttools')), 'ezdxf', ezdxf.__version__, 'C extensions used', ezdxf.options.use_c_ext)")"
          # P6-48: with the wheel's C extensions a few rows differ in the last bits; the run names them. P6-50: those
          # rows are pinned (C_EXT_DRIFT in the generator); a differing row outside them fails this run and the step.
          # P6-52: structural failures (missing table, extra, duplicated or unused rows) are kept beside them and fail too.
          cstatus=0
          cext=$(.tools/ezdxf/bin/python -I tests/cad/tools/minsert_ezdxf_centres.py --check 2>&1) || cstatus=$?
          if [ "$cstatus" -ne 0 ]; then clevel=error; else clevel=notice; fi
          # P6-54: each line is cut at 900 characters; the annotation counts the lines cut. P6-56: the stale line (cut at 900
          # characters by stale_warn below) is counted too. P6-58: the stale line's prefix is defined once, in the generator
          # (STALE_PREFIX), and read from it here.
          stale_prefix=$(.tools/ezdxf/bin/python -I tests/cad/tools/minsert_ezdxf_centres.py --check --stale-prefix)
          cdiff=$(printf '%s\n' "$cext" | grep '^differing rows: ' || true)
          cpick=$(printf '%s\n' "$cext" | grep -e '^C-extension drift: ' -e '^new C-extension drift rows: ' -e 'NOT caught' -e 'not caught as' -e 'not found exactly once' -e '^kept under the C extensions: ' || true)
          clast=$(printf '%s\n' "$cext" | tail -n 1)
          cstale=$(printf '%s\n' "$cext" | grep -e "^$stale_prefix" || true)
          ccut=$(printf '%s\n' "$cdiff" "$cpick" "$clast" "$cstale" | awk 'length > 900' | wc -l | tr -d ' ')
          echo "::$clevel title=ezdxf-check-c-ext::with the wheel's C extensions: $(printf '%s\n' "$cdiff" | cut -c1-900); $(printf '%s\n' "$cpick" | cut -c1-900 | tr '\n' ' '); $(printf '%s\n' "$clast" | cut -c1-900); lines cut at 900 characters: $ccut"
          # P6-52: a pinned C-extension drift row that stops drifting is named in a warning annotation. P6-54: the wiring
          # is one function, checked first on a planted stale line (the step fails unless it yields the annotation).
          # P6-56: grep's no-match is guarded, so stale_warn exits 0 with no stale line, checked with pipefail set (P6-58: set
          # -e does not apply inside an if condition, so the check reads the pipeline's exit status instead); the planted
          # line is printed by the generator (_stale_line, which check_main prints the stale line with).
          stale_warn() { { grep -e "^$stale_prefix" || true; } | cut -c1-900 | sed 's/^/::warning title=ezdxf-check-c-ext-stale::/'; }
          if ! quiet=$(set -o pipefail; printf '%s\n' 'differing rows: none' 'C-extension drift: none' | stale_warn) || [ -n "$quiet" ]; then
            echo "::error title=ezdxf-check-c-ext-stale::the stale-row wiring failed or printed under pipefail with no stale line: $quiet"
            exit 1
          fi
          planted=$(.tools/ezdxf/bin/python -I tests/cad/tools/minsert_ezdxf_centres.py --check --stale-line 'C1>NB')
          if [ "$(printf '%s\n' 'differing rows: none' "$planted" 'C-extension drift: none' | stale_warn)" != "::warning title=ezdxf-check-c-ext-stale::$planted" ]; then
            echo "::error title=ezdxf-check-c-ext-stale::the stale-row wiring did not turn a planted stale line into its warning annotation"
            exit 1
          fi
          printf '%s\n' "$cext" | stale_warn
          # The constants were made by the pure-Python ezdxf of a v1.4.2 source checkout, so the C extensions are disabled.
          out="$RUNNER_TEMP/ezdxf-check.txt"
          status=0
          EZDXF_DISABLE_C_EXT=1 .tools/ezdxf/bin/python -I tests/cad/tools/minsert_ezdxf_centres.py --check > "$out" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then level=error; else level=notice; fi
          # P6-48: every output line but the caught self-tests is annotated, 20 lines an annotation (GitHub keeps 10 per
          # step and level, so at most 9 here); the count of any lines left over is printed in the last one.
          grep -v '^self-test planted .*: caught (' "$out" | cut -c1-900 | awk -v level="$level" '
            { gsub(/\r/, ""); gsub(/%/, "%25"); lines[NR] = $0 }
            END {
              chunks = int((NR + 19) / 20); shown = chunks > 9 ? 9 : chunks
              for (c = 0; c < shown; c++) {
                msg = ""; last = (c + 1) * 20 > NR ? NR : (c + 1) * 20
                for (i = c * 20 + 1; i <= last; i++) msg = msg (msg == "" ? "" : "%0A") lines[i]
                printf "::%s title=ezdxf-check lines %d-%d of %d::%s\n", level, c * 20 + 1, last, NR, msg
              }
              if (NR > shown * 20) printf "::%s title=ezdxf-check::%d more output lines not annotated (lines %d-%d of %d)\n", level, NR - shown * 20, shown * 20 + 1, NR, NR
            }'
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$cstatus"
      - name: Evaluate real IFC and enforce portable acceptance
        shell: pwsh
        run: |
          & ./scripts/evaluate.ps1 -Backend ifc -Python (Join-Path $pwd '.tools/ifc/bin/python') -OutputDirectory (Join-Path $pwd '.bim/ci-ifc')
          $evaluationExit = $LASTEXITCODE
          $report = Get-Content .bim/ci-ifc/report.json -Raw | ConvertFrom-Json
          if ($evaluationExit -ne 2 -or !$report.backend_acceptance -or $report.product_acceptance -or $report.verification_state -ne 'integration-tested (ifc)' -or $report.counts.failed -ne 0) { throw 'Real IFC portable acceptance failed or native acceptance was falsely promoted' }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifc-integration-evidence
          include-hidden-files: true
          path: |
            .bim/ci-ifc/report.json
            .bim/ci-ifc/hashes.json
            .bim/ci-ifc/benchmarks.json
      - name: IFC incremental vs full-rebuild benchmark (P01)
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/benchmark-rebuild.ps1 -Python (Join-Path $pwd '.tools/ifc/bin/python') -Samples 10 -OutputDirectory (Join-Path $pwd '.bim/rebuild-benchmark') -Notice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifc-rebuild-benchmark
          include-hidden-files: true
          path: .bim/rebuild-benchmark/
  rhino:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install approved isolated rhino3dm (MIT) dependency
        run: |
          python -m venv .tools/rhino
          .tools/rhino/bin/python -m pip install --only-binary=:all: -r requirements/rhino.txt
          .tools/rhino/bin/python -m pip check
      - name: Real rhino3dm .3dm adapter regressions
        run: .tools/rhino/bin/python -I tests/rhino/run.py
  core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, core/evaluator unit health, static gates and benchmark on Windows
        shell: pwsh
        run: ./scripts/verify.ps1
  ifc-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install approved isolated IFC dependencies
        shell: pwsh
        run: |
          python -m venv .tools/ifc
          $py = if ($IsWindows) { '.tools/ifc/Scripts/python.exe' } else { '.tools/ifc/bin/python' }
          & $py -m pip install -r requirements/ifc.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "IFC_PY=$((Resolve-Path $py).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real IFC integration regressions
        shell: pwsh
        run: |
          & $env:IFC_PY -m unittest discover -s tests/ifc -p 'test_*.py' -v
          exit $LASTEXITCODE
      - name: Evaluate real IFC and enforce portable acceptance
        shell: pwsh
        run: |
          & ./scripts/evaluate.ps1 -Backend ifc -Python $env:IFC_PY -OutputDirectory (Join-Path $pwd '.bim/ci-ifc')
          $evaluationExit = $LASTEXITCODE
          $report = Get-Content .bim/ci-ifc/report.json -Raw | ConvertFrom-Json
          if ($evaluationExit -ne 2 -or !$report.backend_acceptance -or $report.product_acceptance -or $report.verification_state -ne 'integration-tested (ifc)' -or $report.counts.failed -ne 0) { throw 'Real IFC portable acceptance failed or native acceptance was falsely promoted' }
          exit 0
      - name: Build CLI and bounded CLI input tests (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet build interfaces/cli --configuration Release --warnaserror
          dotnet build tests/cli --configuration Release --warnaserror
      - name: Bounded CLI input tests (macOS)
        if: runner.os == 'macOS'
        run: dotnet run --project tests/cli --configuration Release --no-build
      - name: Write progress at a mid-args break (macOS, P2-33)
        if: runner.os == 'macOS'
        run: |
          dotnet build tests/mirror-journal --configuration Release --warnaserror
          dotnet run --project tests/mirror-journal --configuration Release --no-build -- --write-progress-only
      - name: MCP generate_typology stdio section 9 alone (macOS, P3-38)
        id: mcp-section-9
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          # P3-40: each project builds once: tests/mcp links the server sources (no ProjectReference to interfaces/mcp),
          # and section 9 launches the built interfaces/mcp Bim.Mcp.dll.
          dotnet build interfaces/mcp --configuration Release --warnaserror
          dotnet build tests/mcp --configuration Release --warnaserror
          tests_dll="$PWD/tests/mcp/bin/Release/net8.0/Bim.Mcp.Tests.dll"
          out="$RUNNER_TEMP/mcp-section-9.txt"
          BIM_TEST_P3_38_SECTION=9 DOTNET_STARTUP_HOOKS="$tests_dll" dotnet "$tests_dll" | tee "$out"
          grep -q '"section":9' "$out"
          # P3-40: the PASS lines stay readable without the log: a notice per measured fact, the step summary, the artifact.
          # P3-42: the greps below are guarded (|| true), so under pipefail a grep that matches nothing cannot fail the step.
          # P3-44: the notice grep matches the capacity check's PASS line and the closed-pipe lines only, not the contract checks.
          # P3-44: macOS posts its capacity twice, stated: the test's mcp-pipe-capacity-macOS notice (figures and run times, as on
          # Linux and Windows) and the notice of the capacity check's PASS line below (the verdict against the 64 KiB bound).
          echo "::notice title=mcp-section-9-macos::$(grep -c '^PASS ' "$out" || true) PASS lines; $(tail -n 1 "$out")"
          { grep -E '^PASS generate_typology P3-34 stdio stderr: (P3-40 measured pipe capacity on |the real process over stdio, .*closed pipe.s write did not throw)' "$out" || true; } | cut -c1-900 | sed 's/^/::notice title=mcp-section-9-macos::/'
          { echo '### MCP generate_typology section 9 (macOS)'; echo '```'; grep '^PASS ' "$out" || true; tail -n 1 "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the MCP section 9 output (macOS, P3-40)
        if: always() && runner.os == 'macOS' && steps.mcp-section-9.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: mcp-section-9-macos
          path: ${{ runner.temp }}/mcp-section-9.txt
          if-no-files-found: error
  native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Revit add-in against build-only reference assemblies
        run: dotnet build runtimes/revit-native/Bim.Revit.csproj --configuration Release --warnaserror
      - name: Assert no Revit assemblies in add-in output
        shell: pwsh
        run: |
          $out = 'runtimes/revit-native/bin/Release/net8.0-windows'
          if (!(Test-Path (Join-Path $out 'Bim.Revit.dll'))) { throw "Bim.Revit.dll missing from $out" }
          $leaked = @(Get-ChildItem $out -Recurse -File -Filter 'Revit*.dll')
          if ($leaked.Count -gt 0) { $leaked | ForEach-Object { "::error::Revit assembly copied to output: $($_.FullName)" }; exit 1 }
          'PASS no Revit*.dll in add-in output'
  codeql-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
# native-build only compiles the add-in against build-only reference assemblies (ADR 0009 point 5).
# Native execution CI stays BLOCKED: no licensed Windows/Revit runner; guarded executable probes run locally.
# Do not add a green placeholder or require Autodesk secrets on public runners.

# Core evaluator health uses synthetic observations and explicit missing-prerequisite paths.
# The IFC job separately enforces real portable integration; native-only Test A/B stays unsupported.

