name: engineering-gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Worktree retire safety oracle
        run: bash tests/baton/worktree-retire.test.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, core/evaluator unit health, static gates and benchmark
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Dependency vulnerability audit
        shell: pwsh
        run: ./scripts/audit-dependencies.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          include-hidden-files: true
          path: |
            .bim/verification/
            .bim/evaluation/
            .bim/dependency-audit/
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build interfaces/cli/Bim.Cli.csproj --configuration Release
      - uses: github/codeql-action/analyze@v3
  ifc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install approved isolated IFC dependencies
        run: |
          python -m venv .tools/ifc
          .tools/ifc/bin/python -m pip install -r requirements/ifc.txt
          .tools/ifc/bin/python -m pip check
      - name: Real IFC integration regressions
        run: .tools/ifc/bin/python -m unittest discover -s tests/ifc -p 'test_*.py' -v
      - name: Evaluate real IFC and enforce portable acceptance
        shell: pwsh
        run: |
          & ./scripts/evaluate.ps1 -Backend ifc -Python (Join-Path $pwd '.tools/ifc/bin/python') -OutputDirectory (Join-Path $pwd '.bim/ci-ifc')
          $evaluationExit = $LASTEXITCODE
          $report = Get-Content .bim/ci-ifc/report.json -Raw | ConvertFrom-Json
          if ($evaluationExit -ne 2 -or !$report.backend_acceptance -or $report.product_acceptance -or $report.verification_state -ne 'integration-tested (ifc)' -or $report.counts.failed -ne 0) { throw 'Real IFC portable acceptance failed or native acceptance was falsely promoted' }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifc-integration-evidence
          include-hidden-files: true
          path: |
            .bim/ci-ifc/report.json
            .bim/ci-ifc/hashes.json
            .bim/ci-ifc/benchmarks.json
      - name: IFC incremental vs full-rebuild benchmark (P01)
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/benchmark-rebuild.ps1 -Python (Join-Path $pwd '.tools/ifc/bin/python') -Samples 10 -OutputDirectory (Join-Path $pwd '.bim/rebuild-benchmark') -Notice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifc-rebuild-benchmark
          include-hidden-files: true
          path: .bim/rebuild-benchmark/
  core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, core/evaluator unit health, static gates and benchmark on Windows
        shell: pwsh
        run: ./scripts/verify.ps1
  ifc-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install approved isolated IFC dependencies
        shell: pwsh
        run: |
          python -m venv .tools/ifc
          $py = if ($IsWindows) { '.tools/ifc/Scripts/python.exe' } else { '.tools/ifc/bin/python' }
          & $py -m pip install -r requirements/ifc.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "IFC_PY=$((Resolve-Path $py).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real IFC integration regressions
        shell: pwsh
        run: |
          & $env:IFC_PY -m unittest discover -s tests/ifc -p 'test_*.py' -v
          exit $LASTEXITCODE
      - name: Evaluate real IFC and enforce portable acceptance
        shell: pwsh
        run: |
          & ./scripts/evaluate.ps1 -Backend ifc -Python $env:IFC_PY -OutputDirectory (Join-Path $pwd '.bim/ci-ifc')
          $evaluationExit = $LASTEXITCODE
          $report = Get-Content .bim/ci-ifc/report.json -Raw | ConvertFrom-Json
          if ($evaluationExit -ne 2 -or !$report.backend_acceptance -or $report.product_acceptance -or $report.verification_state -ne 'integration-tested (ifc)' -or $report.counts.failed -ne 0) { throw 'Real IFC portable acceptance failed or native acceptance was falsely promoted' }
          exit 0
      - name: Build CLI and bounded CLI input tests (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet build interfaces/cli --configuration Release --warnaserror
          dotnet build tests/cli --configuration Release --warnaserror
      - name: Bounded CLI input tests (macOS)
        if: runner.os == 'macOS'
        run: dotnet run --project tests/cli --configuration Release --no-build
  codeql-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
# Native CI BLOCKED: no licensed Windows/Revit runner; guarded executable probes run locally.
# Do not add a green placeholder or require Autodesk secrets on public runners.

# Core evaluator health uses synthetic observations and explicit missing-prerequisite paths.
# The IFC job separately enforces real portable integration; native-only Test A/B stays unsupported.

